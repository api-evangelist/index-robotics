name: INDEX Robotics
description: INDEX Robotics is a South Korean humanoid robotics startup based in Seongnam
  (Bundang) building high-precision actuators and upper-body humanoid robots for high-mix,
  low-volume industrial work. Its core products are the IA Series, a family of high-precision
  actuators purpose-built for humanoid joints, and INDEX01, a compact upper-body humanoid
  prototype that deliberately foregoes a mobile base so it can slot into constrained
  factory workspaces for logistics handling, machining support, and precision assembly.
  The company treats joint precision, responsiveness under sustained repetitive motion,
  and long-run performance consistency as the core unsolved problems in humanoid
  commercialization. In February 2026 INDEX Robotics closed a $1M (KRW 1.5B) seed round
  led by Futureplay with Bass Ventures and 500 Global co-investing. This is a hardware
  company with no public API, SDK, or developer program at this time.
